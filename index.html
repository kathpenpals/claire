<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Hug for Claire</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .app-container {
            background: linear-gradient(-45deg, #ffd9e8, #ffe0b2, #f8f8ff, #ffc9e3);
            background-size: 400% 400%;
            animation: softBackground 15s ease infinite;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        @keyframes softBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .content-wrapper {
            width: 100%;
            max-width: 400px;
            animation: fadeIn 0.4s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 2.2rem;
            color: #fff;
            text-shadow: 2px 2px 0px #e84bb0, -2px -2px 0px #e84bb0, 2px -2px 0px #e84bb0, -2px 2px 0px #e84bb0;
            margin-top: 10px;
            margin-bottom: 5px;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 1.2rem;
            font-weight: 700;
            color: #d32f7f;
            margin-bottom: 30px;
        }

        /* Main Mood Buttons */
        .mood-btn {
            border: 3px solid #fff;
            padding: 18px 20px;
            margin: 15px 0;
            border-radius: 40px;
            font-size: 1.3rem;
            font-family: 'Fredoka One', cursive;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            color: #fff;
            box-shadow: 0 6px 0 rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .mood-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.1);
        }

        .btn-sunny { background: linear-gradient(to right, #ffb74d, #ffca28); text-shadow: 1px 1px #f57c00; }
        .btn-okay { background: linear-gradient(to right, #81c784, #aed581); text-shadow: 1px 1px #388e3c; }
        .btn-raining { background: linear-gradient(to right, #4fc3f7, #81d4fa); text-shadow: 1px 1px #0288d1; }

        /* Pet Screen Specifics */
        .speech-bubble {
            background: #fff;
            border-radius: 20px;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            color: #d32f7f;
            border: 3px solid #f06292;
            display: inline-block;
            margin-bottom: 15px;
            position: relative;
            box-shadow: 0 4px 0 #f06292;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 12px 12px 0;
            border-style: solid;
            border-color: #f06292 transparent transparent transparent;
            display: block;
            width: 0;
        }

        .pet-character {
            font-size: 5rem;
            margin: 10px 0 25px 0;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Breathing Animation */
        .breathing {
            animation: breatheCycle 10s ease-in-out infinite !important;
        }

        @keyframes breatheCycle {
            0% { transform: scale(1); }
            40% { transform: scale(1.4); }
            60% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }

        .breathe-text {
            font-size: 1.5rem;
            font-family: 'Fredoka One', cursive;
            color: #0288d1;
            margin-bottom: 20px;
            min-height: 40px;
        }

        /* Joy Bar */
        .joy-bar-container {
            width: 100%;
            background-color: #fff;
            border-radius: 20px;
            height: 35px;
            margin: 20px 0;
            border: 3px solid #d32f7f;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.1);
        }

        .joy-bar {
            height: 100%;
            background: linear-gradient(90deg, #f06292 0%, #ec407a 100%);
            width: 15%; 
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .joy-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: 700;
            font-size: 1rem;
            color: #d32f7f;
            width: 100%;
        }

        /* Action Buttons */
        .action-btns {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .action-btn {
            background-color: #fff;
            border: 3px solid #f06292;
            border-radius: 20px;
            padding: 12px 5px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            color: #d32f7f;
            cursor: pointer;
            flex: 1;
            min-width: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 0 #f06292;
            transition: all 0.2s;
        }

        .action-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #f06292;
        }

        .action-icon {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .breathe-btn {
            background-color: #e1f5fe;
            border-color: #4fc3f7;
            box-shadow: 0 4px 0 #4fc3f7;
            color: #0288d1;
            width: 100%;
            margin-top: 15px;
            flex: none;
        }

        .exit-breathing-btn {
            background-color: #ffebee;
            border-color: #ef5350;
            box-shadow: 0 4px 0 #ef5350;
            color: #c62828;
            width: 100%;
            margin-top: 15px;
            flex: none;
            font-size: 0.75rem;
        }

        .hidden {
            display: none !important;
        }

        .message {
            font-size: 1.1rem;
            margin-top: 25px;
            color: #d32f7f;
            font-weight: bold;
            min-height: 40px;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            font-size: 2rem;
            color: #d32f7f;
            cursor: pointer;
            z-index: 100;
            padding: 10px;
        }

        .back-btn:active {
            transform: scale(1.2);
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- MOOD TRACKER SCREEN -->
        <div id="mood-screen" class="content-wrapper">
            <h1>Daily Hug<br><span style="font-size: 1.8rem; color: #fff;">for Claire</span></h1>
            <p class="subtitle">Hello Claire!<br>How is your heart today?</p>
            
            <button class="mood-btn btn-sunny" onclick="logMood('happy')">🌸 SUNNY! 😊</button>
            <button class="mood-btn btn-okay" onclick="logMood('okay')">☁️ OKAY! 😐</button>
            <button class="mood-btn btn-raining" onclick="logMood('sad')">💧 RAINING... 😢</button>
            
            <div class="message" id="mood-message"></div>
        </div>

        <!-- TAMAGOTCHI SCREEN -->
        <div id="pet-screen" class="content-wrapper hidden">
            <button class="back-btn" onclick="resetApp()">❮</button>
            <h2 style="font-family: 'Fredoka One'; color: #d32f7f; font-size: 1.8rem; margin-top: 10px; margin-bottom: 5px;">Oh No! Little Pip<br>needs a cuddle!</h2>
            <p style="font-size: 1.1rem; font-weight: 700; color: #e84bb0;" id="pet-subtitle">Can you help cheer up the bunny?</p>
            
            <div class="speech-bubble" id="pet-speech">
                *Sniff*... I feel blue too...<br>Care for me?
            </div>
            
            <div class="breathe-text hidden" id="breathe-text">Breathe in...</div>

            <div class="pet-character" id="pet-face">
                🥺🐰
            </div>
            
            <div class="joy-bar-container" id="joy-container">
                <div class="joy-bar" id="joy-bar" style="width: 15%;"></div>
                <div class="joy-text" id="joy-text">☹️ Pip's Joy: 15%</div>
            </div>

            <div class="action-btns" id="action-buttons">
                <button class="action-btn" style="background-color: #fff3e0; border-color: #ffb74d; box-shadow: 0 4px 0 #ffb74d;" onclick="careForPip('feed')">
                    <span class="action-icon">🥕</span> Crunch
                </button>
                <button class="action-btn" style="background-color: #fce4ec; border-color: #f06292; box-shadow: 0 4px 0 #f06292;" onclick="careForPip('hug')">
                    <span class="action-icon">🧸</span> Hug
                </button>
                <button class="action-btn" style="background-color: #e3f2fd; border-color: #64b5f6; box-shadow: 0 4px 0 #64b5f6;" onclick="careForPip('tune')">
                    <span class="action-icon">🎵</span> Music
                </button>
            </div>

            <button class="action-btn breathe-btn" id="breathe-btn" onclick="startBreathing()">
                <span class="action-icon">🌬️</span> Breathe with Pip
            </button>

            <button class="action-btn exit-breathing-btn hidden" id="exit-breathe-btn" onclick="exitBreathing()">
                ✕ Exit Breathing
            </button>
        </div>

    </div>

    <script>
        let pipJoy = 15;
        let breathingInterval;
        let isBreathing = false;

        const moodScreen = document.getElementById('mood-screen');
        const petScreen = document.getElementById('pet-screen');
        const moodMessage = document.getElementById('mood-message');
        
        const petFace = document.getElementById('pet-face');
        const petSpeech = document.getElementById('pet-speech');
        const joyBar = document.getElementById('joy-bar');
        const joyText = document.getElementById('joy-text');
        const joyContainer = document.getElementById('joy-container');
        const actionButtons = document.getElementById('action-buttons');
        const breatheBtn = document.getElementById('breathe-btn');
        const breatheText = document.getElementById('breathe-text');
        const petSubtitle = document.getElementById('pet-subtitle');
        const exitBreatheBtn = document.getElementById('exit-breathe-btn');

        // ✨ CUSTOM AFFIRMATIONS ✨
        const affirmations = [
            "Yay! Thank you, Claire! Remember, I am always here for you. You've got this! 💕",
            "We did it! You are so incredibly loved, Claire. Take it one day at a time. 🌻",
            "I feel so much better! You bring so much light to the world. Don't forget that! ✨",
            "All cheered up! Sending you the biggest, warmest virtual hug right now! 🧸",
            "Thank you for taking care of me! Now, promise me you'll take care of yourself too. 🍵"
        ];

        function logMood(mood) {
            if (mood === 'happy') {
                moodMessage.innerText = "I'm so happy your sky is sunny today! Keep shining, Claire! ☀️🌻";
            } else if (mood === 'okay') {
                moodMessage.innerText = "Okay is totally fine. Wishing you a peaceful, cozy day! 🍵🌿";
            } else if (mood === 'sad') {
                moodScreen.classList.add('hidden');
                petScreen.classList.remove('hidden');
                moodMessage.innerText = "";
                
                pipJoy = 15;
                isBreathing = false;
                updatePipUI();
                stopBreathing();
                
                petFace.innerText = "🥺🐰";
                petSpeech.innerHTML = "*Sniff*... I feel blue too...<br>Care for me?";
                actionButtons.classList.remove('hidden');
                breatheBtn.classList.remove('hidden');
                exitBreatheBtn.classList.add('hidden');
                joyContainer.classList.remove('hidden');
                petSpeech.classList.remove('hidden');
            }
        }

        function careForPip(action) {
            if (pipJoy >= 100) return;

            let joyBoost = 0;

            if (action === 'feed') {
                joyBoost = 25;
                petSpeech.innerHTML = "Crunch crunch! This carrot<br>is so yummy! 🥕";
                petFace.innerText = "🐰🥕";
            } else if (action === 'hug') {
                joyBoost = 35;
                petSpeech.innerHTML = "Warm squishy hugs are<br>the best! 🧸💞";
                petFace.innerText = "🧸🐰";
            } else if (action === 'tune') {
                joyBoost = 25;
                petSpeech.innerHTML = "Ahhh... such a lovely<br>melody... 🎵✨";
                petFace.innerText = "🎧🐰";
            }

            pipJoy += joyBoost;
            if (pipJoy > 100) pipJoy = 100;

            updatePipUI();

            if (pipJoy >= 100) {
                setTimeout(() => {
                    petFace.innerText = "🥰🐰💖";
                    const randomMessage = affirmations[Math.floor(Math.random() * affirmations.length)];
                    petSpeech.innerHTML = randomMessage;
                    
                    actionButtons.classList.add('hidden');
                    breatheBtn.classList.add('hidden');
                    exitBreatheBtn.classList.add('hidden');
                }, 1000);
            }
        }

        function updatePipUI() {
            joyBar.style.width = pipJoy + "%";
            
            let emoji = "☹️";
            if (pipJoy > 40) emoji = "😐";
            if (pipJoy > 75) emoji = "🙂";
            if (pipJoy === 100) emoji = "🥰";
            
            joyText.innerText = `${emoji} Pip's Joy: ${pipJoy}%`;
        }

        function startBreathing() {
            isBreathing = true;
            
            actionButtons.classList.add('hidden');
            joyContainer.classList.add('hidden');
            petSpeech.classList.add('hidden');
            breatheBtn.classList.add('hidden');
            
            breatheText.classList.remove('hidden');
            exitBreatheBtn.classList.remove('hidden');
            petSubtitle.innerText = "Follow Pip's rhythm...";
            petFace.innerText = "😌🐰";
            petFace.classList.add('breathing');

            const breatheCycle = () => {
                if (!isBreathing) return;
                breatheText.innerText = "Breathe in...";
                setTimeout(() => {
                    if (!isBreathing) return;
                    breatheText.innerText = "Hold...";
                    setTimeout(() => {
                        if (!isBreathing) return;
                        breatheText.innerText = "Breathe out...";
                    }, 2000);
                }, 4000);
            };

            breatheCycle();
            breathingInterval = setInterval(breatheCycle, 10000);
        }

        function exitBreathing() {
            isBreathing = false;
            stopBreathing();
            
            petFace.innerText = "🥺🐰";
            petSpeech.innerHTML = "*Sniff*... I feel blue too...<br>Care for me?";
            actionButtons.classList.remove('hidden');
            breatheBtn.classList.remove('hidden');
            exitBreatheBtn.classList.add('hidden');
            joyContainer.classList.remove('hidden');
            petSpeech.classList.remove('hidden');
            petSubtitle.innerText = "Can you help cheer up the bunny?";
        }

        function stopBreathing() {
            isBreathing = false;
            clearInterval(breathingInterval);
            petFace.classList.remove('breathing');
            breatheText.classList.add('hidden');
            exitBreatheBtn.classList.add('hidden');
        }

        function resetApp() {
            isBreathing = false;
            stopBreathing();
            petScreen.classList.add('hidden');
            moodScreen.classList.remove('hidden');
            moodMessage.innerText = "Welcome back, Claire! 🌱";
        }
    </script>
</body>
</html>
